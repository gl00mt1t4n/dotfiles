background {
    monitor =
    blur_passes = 3
    blur_size = 7
    noise = 0.012
    contrast = 0.9
    brightness = 0.8
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(cdd6f4ff)
    font_size = 90
    font_family = JetBrainsMono Nerd Font
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %B %d")"
    color = rgba(cdd6f4cc)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 30
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.3
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgb(313244)
    inner_color = rgb(1e1e2e)
    font_color = rgb(cdd6f4)
    placeholder_text = <i>Password</i>
    check_color = rgb(a6e3a1)
    fail_color = rgb(f38ba8)
    fail_text = <i>Incorrect ($ATTEMPTS)</i>
    rounding = 10
    fade_on_empty = true
    position = 0, -60
    halign = center
    valign = center
}
