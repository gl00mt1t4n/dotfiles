font_family      MesloLGS Nerd Font Mono
font_size        12.5

window_padding_width    5
hide_window_decorations yes

cursor_shape        beam
cursor_blink_interval 0

# Auto-copy selected text to system clipboard
copy_on_select clipboard

# Ctrl+C: copy if text is selected, otherwise send SIGINT (matches browser behavior)
map ctrl+c copy_or_interrupt
# Ctrl+V: paste from clipboard. Note: this is intercepted before neovim sees it,
# so ctrl+v visual-block mode in neovim won't work — use "+p there instead.
map ctrl+v paste_from_clipboard
